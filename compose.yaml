
name: car-rest-service

services:
  app:
    image: car-rest-service:local
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0"

      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?KEYCLOAK_ISSUER_URI is required}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/car-service/protocol/openid-connect/certs

    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 1g

  postgres:
    image: postgres:16-alpine
    container_name: car-rest-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data:/data:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          memory: 512M

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: car-rest-keycloak
    command: ["start-dev", "--import-realm"]

    environment:
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      CAR_EDITOR_PASSWORD: ${CAR_EDITOR_PASSWORD:?CAR_EDITOR_PASSWORD is required}
      CATALOG_EDITOR_PASSWORD: ${CATALOG_EDITOR_PASSWORD:?CATALOG_EDITOR_PASSWORD is required}
      CAR_TESTER_PASSWORD: ${CAR_TESTER_PASSWORD:?CAR_TESTER_PASSWORD is required}

    ports:
      - "127.0.0.1:8180:8080"

    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro

    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  postgres-data:
    external: true
    name: car-rest-postgres-data

  keycloak-data:
    external: true
    name: car-rest-keycloak-data
