services:
  postgres:
    image: postgres:16-alpine
    container_name: car-rest-postgres

    environment:
      POSTGRES_DB: car_rest_db
      POSTGRES_USER: car_rest
      POSTGRES_PASSWORD: car_rest

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data:/data:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_rest -d car_rest_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
    name: car-rest-postgres-data