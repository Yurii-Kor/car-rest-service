name: car-rest-service

services:
  postgres:
    image: postgres:16-alpine
    container_name: car-rest-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data:/data:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: car-rest-keycloak
    command: ["start-dev", "--import-realm"]

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      CAR_EDITOR_PASSWORD: ${CAR_EDITOR_PASSWORD:?CAR_EDITOR_PASSWORD is required}
      CATALOG_EDITOR_PASSWORD: ${CATALOG_EDITOR_PASSWORD:?CATALOG_EDITOR_PASSWORD is required}
      CAR_TESTER_PASSWORD: ${CAR_TESTER_PASSWORD:?CAR_TESTER_PASSWORD is required}

    ports:
      - "127.0.0.1:8180:8080"

    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro

volumes:
  postgres-data:
    external: true
    name: car-rest-postgres-data

  keycloak-data:
    name: car-rest-keycloak-data
